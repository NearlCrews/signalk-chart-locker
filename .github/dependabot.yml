version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # The shared UI package ships breaking changes in 0.x minors and is pinned exactly, so its
      # update arrives alone and is reviewed against the library's migration guide.
      signalk-nearlcrews-ui:
        patterns:
          - "signalk-nearlcrews-ui"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "signalk-nearlcrews-ui"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Keep type definitions aligned with the oldest supported Node runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - npm

  - package-ecosystem: cargo
    directory: /container
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - cargo

  - package-ecosystem: docker
    directory: /container/tilecache
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - container

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # The reusable plugin-ci workflow is pinned to a signalk-server master commit and bumped by
    # hand each release. Dependabot resolves it against signalk-server's release tags, and once
    # proposed a tag whose commit predates the workflow entirely, which broke the run.
    ignore:
      - dependency-name: "SignalK/signalk-server/.github/workflows/plugin-ci.yml"
    labels:
      - dependencies
      - github-actions
